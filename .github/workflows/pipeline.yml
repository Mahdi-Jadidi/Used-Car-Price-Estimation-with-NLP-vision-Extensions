name: Data Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipeline-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Phase 3 training and prediction pipelines
      run: |
        python pipeline.py

    - name: Verify prediction database
      run: |
        python -c "import sqlite3; c=sqlite3.connect('artifacts/predictions.db'); assert c.execute('SELECT COUNT(*) FROM model_predictions').fetchone()[0] > 0"
